name: "Wails Build Action"
description: "Creates a wails binary"

inputs:
  sign:
    description: "Sign the build"
    required: false
    default: "false"
  package:
    description: "Uploads workflow & uploads tag builds to a release"
    required: false
    default: "true"
  build-name:
    description: "The name of the binary file"
    required: true
  macos-app-name:
    description: "The name of the macOS app (without .app)"
    required: false
    default: "Obox App"
  build-platform:
    description: "Platform to build for"
    required: false
    default: "darwin/universal"
  wails-version:
    description: "Wails version to use"
    required: false
    default: "latest"
  wails-build-webview2:
    description: "Webview2 installer method [download,embed,browser,error]"
    required: false
    default: "download"
  go-version:
    description: "Version of Go to use"
    required: false
    default: "1.26.0"
  node-version:
    description: "Node js version"
    required: false
    default: "22.x"
  sign-macos-app-id:
    description: "MacOS Application Certificate id"
    required: false
    default: ""
  sign-macos-apple-id:
    description: "Apple ID (email) used for notarization"
    required: false
    default: ""
  sign-macos-team-id:
    description: "Apple Developer Team ID used for notarization"
    required: false
    default: ""
  sign-macos-apple-password:
    description: "MacOS Apple password"
    required: false
    default: ""
  sign-macos-app-cert:
    description: "MacOS Application Certificate"
    required: false
    default: ""
  sign-macos-app-cert-password:
    description: "MacOS Application Certificate Password"
    required: false
    default: ""
  sign-macos-installer-id:
    description: "MacOS Installer Certificate id"
    required: false
    default: ""
  sign-macos-installer-cert:
    description: "MacOS Installer Certificate"
    required: false
    default: ""
  sign-macos-installer-cert-password:
    description: "MacOS Installer Certificate Password"
    required: false
    default: ""
  sign-windows-cert:
    description: "Windows Signing Certificate"
    required: false
    default: ""
  sign-windows-cert-password:
    description: "Windows Signing Certificate Password"
    required: false
    default: ""
  token:
    description: "GitHub token"
    required: true

runs:
  using: "composite"
  steps:
    # ── Toolchains ───────────────────────────────────────────────────────────
    - name: Setup Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x

    - name: Setup GoLang
      uses: actions/setup-go@v5
      with:
        check-latest: true
        cache: true
        go-version: ${{ inputs.go-version }}
    - run: go version
      shell: bash

    - name: Setup NodeJS
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # ── System dependencies ──────────────────────────────────────────────────
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: task ci:deps:linux

    - name: Install macOS Dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: task ci:deps:darwin

    - name: Install Windows Wails deps
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        install: >-
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-nsis

    - name: Get Go path (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: echo "GO_BIN=$(ls -d /c/hostedtoolcache/windows/go/*/x64/bin | tail -1)" >> $GITHUB_ENV

    # ── Wails CLI ────────────────────────────────────────────────────────────
    - name: Install Wails v3 CLI
      shell: bash
      env:
        WAILS_VERSION: ${{ inputs.wails-version }}
      run: task ci:deps:wails WAILS_VERSION="$WAILS_VERSION"

    # ── Build ────────────────────────────────────────────────────────────────
    - name: Build Application (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      env:
        BUILD_NAME: ${{ inputs.build-name }}
      run: task build:ci BUILD_NAME="$BUILD_NAME"

    - name: Build Application (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        BUILD_NAME: ${{ inputs.build-name }}
        CGO_ENABLED: "1"
        CGO_CFLAGS: "-I/mingw64/include/libusb-1.0"
        CGO_LDFLAGS: "-L/mingw64/lib -lusb-1.0 -static -lsetupapi"
      run: |
        export PATH="$PATH:/c/Users/runneradmin/go/bin:${GO_BIN}:/c/Program Files/nodejs"
        task build:ci BUILD_NAME="$BUILD_NAME"

    # ── Tests (stop before signing/publishing if they fail) ──────────────────
    - name: Run Tests (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: task test

    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        CGO_ENABLED: "1"
        CGO_CFLAGS: "-I/mingw64/include/libusb-1.0"
        CGO_LDFLAGS: "-L/mingw64/lib -lusb-1.0 -static -lsetupapi"
      run: |
        export PATH="$PATH:/c/Users/runneradmin/go/bin:${GO_BIN}"
        task test

    # ── Windows signing ──────────────────────────────────────────────────────
    - name: Sign Windows installer
      if: runner.os == 'Windows' && inputs.sign != 'false' && inputs.sign-windows-cert != '' && startsWith(github.ref, 'refs/tags/')
      shell: msys2 {0}
      env:
        BUILD_NAME: ${{ inputs.build-name }}
        WINDOWS_CERT: ${{ inputs.sign-windows-cert }}
        WINDOWS_CERT_PASSWORD: ${{ inputs.sign-windows-cert-password }}
      run: |
        export PATH="$PATH:/c/Users/runneradmin/go/bin:${GO_BIN}"
        mkdir -p certificate
        echo "$WINDOWS_CERT" | base64 -d > certificate/certificate.pfx
        export WINDOWS_CERT_FILE="certificate/certificate.pfx"
        # newest x64 signtool, converted to a native Windows path
        export SIGNTOOL="$(cygpath -w "$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64/signtool.exe | sort -V | tail -1)")"
        task sign:windows BUILD_NAME="$BUILD_NAME"
        rm -rf certificate

    # ── macOS signing / notarization / packaging ─────────────────────────────
    - name: Import Code-Signing Certificates for macOS
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-app-cert != '' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v1
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-app-cert }}
        p12-password: ${{ inputs.sign-macos-app-cert-password }}

    - name: Import Code-Signing Certificates for macOS Installer
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-installer-cert != '' && startsWith(github.ref, 'refs/tags/')
      uses: Apple-Actions/import-codesign-certs@v1
      with:
        keychain-password: ${{ inputs.sign-macos-apple-password }}
        p12-file-base64: ${{ inputs.sign-macos-installer-cert }}
        p12-password: ${{ inputs.sign-macos-installer-cert-password }}
        create-keychain: false

    - name: Sign & Notarize macOS Application
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-app-id != '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        SIGN_IDENTITY: ${{ inputs.sign-macos-app-id }}
        APPLE_ID: ${{ inputs.sign-macos-apple-id }}
        APPLE_APP_PASSWORD: ${{ inputs.sign-macos-apple-password }}
        TEAM_ID: ${{ inputs.sign-macos-team-id }}
      run: task sign:darwin

    - name: Build macOS .app zip
      if: runner.os == 'macOS'
      shell: bash
      env:
        APP_NAME: ${{ inputs.macos-app-name }}
        BUILD_NAME: ${{ inputs.build-name }}
      run: |
        if [ -d "build/bin/${APP_NAME}.app" ]; then
          ditto -c -k --keepParent "build/bin/${APP_NAME}.app" "build/bin/${BUILD_NAME}.app.zip"
        else
          echo "::warning::build/bin/${APP_NAME}.app not found; skipping .app.zip"
        fi

    - name: Build macOS Installer (.pkg)
      if: runner.os == 'macOS' && inputs.sign != 'false' && inputs.sign-macos-installer-id != '' && startsWith(github.ref, 'refs/tags/')
      shell: bash
      env:
        APP_NAME: ${{ inputs.macos-app-name }}
        BUILD_NAME: ${{ inputs.build-name }}
        INSTALLER_ID: ${{ inputs.sign-macos-installer-id }}
      run: |
        productbuild --sign "$INSTALLER_ID" --component "build/bin/${APP_NAME}.app" /Applications "build/bin/${BUILD_NAME}.pkg"

    # ── Publish / Release ────────────────────────────────────────────────────
    - name: Upload Artifacts
      if: inputs.package == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.build-name }}
        path: build/bin/*

    - name: Create Release
      if: inputs.package == 'true' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: build/bin/*
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
